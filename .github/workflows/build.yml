name: Build VitaRetro VPK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: vitasdk/vitasdk:2026.08
    steps:
      - uses: actions/checkout@v4

      - name: Install archive extractor
        shell: bash
        run: |
          apt-get update
          apt-get install -y --no-install-recommends unzip zip p7zip-full

      - name: Prepare RetroArch Vita and build VitaRetro
        shell: bash
        run: |
          bash scripts/build_vpk.sh

      - name: Verify package contents
        shell: bash
        run: bash scripts/verify_vpk.sh VitaRetro_0.1_DEV.vpk

      - uses: actions/upload-artifact@v4
        with:
          name: VitaRetro-0.1-DEV
          path: VitaRetro_0.1_DEV.vpk
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: VitaRetro-0.1-DEV
      - name: Publish direct VPK download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -s VitaRetro_0.1_DEV.vpk
          if gh release view 0.1-dev --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload 0.1-dev VitaRetro_0.1_DEV.vpk --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create 0.1-dev VitaRetro_0.1_DEV.vpk \
              --repo "$GITHUB_REPOSITORY" \
              --title "VitaRetro 0.1 DEV" \
              --notes "Build de test PS Vita. Version 0.1 DEV jusqu'a validation de l'installation et du demarrage sur Vita." \
              --prerelease
          fi
